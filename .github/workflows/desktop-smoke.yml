name: Desktop smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    uses: ./.github/workflows/dev-build.yml
  desktop:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The XPS fork changes news, but these public base shell APIs match it.
        omarchy: [0f8af9be307d5d4f12cc0f6394892cac651ed5e6, f99d33a8ddee7b36509a71a6d20d5d23355ce8b1]
        include:
          # Core's merged palette fix, with matching Qt/Quickshell packages.
          - omarchy: b83d3df0840504299d3099ebf391eb8110527edd
            archive: 2026/10/09
            qt: 6.12.0
            quickshell: 0.3.2
          # Exercise the official renderer and the actual Core configuration.
          - omarchy: 14987189695a8ae1f2270262fdf77446fafb1ba3
            archive: 2026/10/09
            qt: 6.12.0
            quickshell: 0.3.2
            native_titlebars: true
    env:
      NATIVE_TITLEBARS: ${{ matrix.native_titlebars && '1' || '0' }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OMARCHY_SHA: ${{ matrix.omarchy }}
      ARCH_SNAPSHOT: ${{ matrix.archive || '2026/09/30' }}
      EXPECTED_QT: ${{ matrix.qt || '6.11.2' }}
      EXPECTED_QUICKSHELL: ${{ matrix.quickshell || '0.3.1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: omacom/omarchy
          ref: ${{ env.OMARCHY_SHA }}
          path: upstream-omarchy
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: desktop-bundle
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils acl
      - name: Boot disposable Arch VM and exercise the real desktop
        run: bash tests/desktop/vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.omarchy }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-evidence/
          retention-days: 14
          if-no-files-found: error
